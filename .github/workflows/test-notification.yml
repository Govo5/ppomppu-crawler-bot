name: 📢 텔레그램 알림 테스트

on:
  workflow_dispatch:  # 수동 실행 전용
    inputs:
      test_type:
        description: '테스트 유형'
        required: true
        default: 'silent'
        type: choice
        options:
        - silent      # 조용한 메시지
        - normal      # 일반 메시지 (알림 있음)
        - compare     # 연속 비교 테스트

jobs:
  test-notification:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        
    - name: 🔇 조용한 메시지 테스트
      if: ${{ github.event.inputs.test_type == 'silent' }}
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: |
        python -c "
        import requests
        import json
        from datetime import datetime
        import os
        
        TELEGRAM_TOKEN = os.getenv('TELEGRAM_TOKEN')
        CHAT_ID = os.getenv('CHAT_ID')
        
        current_time = datetime.now().strftime('%H:%M:%S')
        message = f'🔇 [GitHub Actions] 조용한 메시지 테스트 - {current_time}'
        
        url = f'https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage'
        data = {
            'chat_id': CHAT_ID,
            'text': message,
            'disable_notification': True,
            'parse_mode': 'HTML'
        }
        
        headers = {'Content-Type': 'application/json'}
        response = requests.post(url, json=data, headers=headers, timeout=30)
        
        if response.status_code == 200:
            print('✅ 조용한 메시지 전송 성공')
        else:
            print(f'❌ 전송 실패: {response.status_code}')
            print(f'응답: {response.text}')
        "
        
    - name: 🔔 일반 메시지 테스트
      if: ${{ github.event.inputs.test_type == 'normal' }}
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: |
        python -c "
        import requests
        import json
        from datetime import datetime
        import os
        
        TELEGRAM_TOKEN = os.getenv('TELEGRAM_TOKEN')
        CHAT_ID = os.getenv('CHAT_ID')
        
        current_time = datetime.now().strftime('%H:%M:%S')
        message = f'🔔 [GitHub Actions] 일반 메시지 테스트 (알림 있음) - {current_time}'
        
        url = f'https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage'
        data = {
            'chat_id': CHAT_ID,
            'text': message,
            'disable_notification': False,
            'parse_mode': 'HTML'
        }
        
        headers = {'Content-Type': 'application/json'}
        response = requests.post(url, json=data, headers=headers, timeout=30)
        
        if response.status_code == 200:
            print('✅ 일반 메시지 전송 성공')
        else:
            print(f'❌ 전송 실패: {response.status_code}')
            print(f'응답: {response.text}')
        "
        
    - name: 🔄 비교 테스트 (조용함 → 일반)
      if: ${{ github.event.inputs.test_type == 'compare' }}
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: |
        python -c "
        import requests
        import json
        import time
        from datetime import datetime
        import os
        
        TELEGRAM_TOKEN = os.getenv('TELEGRAM_TOKEN')
        CHAT_ID = os.getenv('CHAT_ID')
        
        def send_message(message, silent=True):
            url = f'https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage'
            data = {
                'chat_id': CHAT_ID,
                'text': message,
                'disable_notification': silent,
                'parse_mode': 'HTML'
            }
            
            headers = {'Content-Type': 'application/json'}
            response = requests.post(url, json=data, headers=headers, timeout=30)
            return response.status_code == 200
        
        current_time = datetime.now().strftime('%H:%M:%S')
        
        # 1. 조용한 메시지
        print('🔇 조용한 메시지 전송...')
        silent_msg = f'🔇 [비교테스트 1/2] 조용한 메시지 - {current_time}'
        if send_message(silent_msg, silent=True):
            print('✅ 조용한 메시지 전송 성공')
        
        # 3초 대기
        print('⏱️ 3초 대기...')
        time.sleep(3)
        
        # 2. 일반 메시지
        print('🔔 일반 메시지 전송...')
        normal_msg = f'🔔 [비교테스트 2/2] 일반 메시지 (알림 있음) - {current_time}'
        if send_message(normal_msg, silent=False):
            print('✅ 일반 메시지 전송 성공')
        
        print('🎯 비교 테스트 완료! 두 메시지의 알림 차이를 확인해보세요.')
        "
        
    - name: 📝 테스트 완료
      run: |
        echo "🎉 알림 테스트가 완료되었습니다!"
        echo "📱 텔레그램에서 메시지를 확인하고 알림 동작을 비교해보세요."
